<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17171c" media="(prefers-color-scheme: dark)">
<title>자본주의 시뮬레이터</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="design-system/tokens.css">
<link rel="stylesheet" href="vendor/liquid-glass/liquid-glass.css">
<link rel="stylesheet" href="app/app.css">
</head>
<body>
<div class="app">

  <main class="screens">
    <section class="screen is-active" id="screen-messages" data-screen="messages" aria-labelledby="title-messages">
      <header class="screen-top">
        <h1 class="screen-title" id="title-messages">메시지</h1>
        <p class="screen-sub">아직 받은 메시지가 없어요</p>
      </header>
      <div class="skeletons" style="--rows: 14" aria-hidden="true"></div>
    </section>

    <section class="screen" id="screen-money" data-screen="money" aria-labelledby="title-money">
      <header class="screen-top">
        <h1 class="screen-title" id="title-money">돈</h1>
        <p class="screen-sub">지금 가진 돈이에요</p>
        <p class="amount-hero">1,250,000원</p>
      </header>
      <div class="band" aria-hidden="true"></div>
      <ul class="rows">
        <li class="row"><span class="avatar" aria-hidden="true">생</span><span class="row-text"><b>생활비 통장</b><small>매달 쓰는 돈</small></span><span class="row-value">350,000원</span></li>
        <li class="row"><span class="avatar" aria-hidden="true">비</span><span class="row-text"><b>비상금 통장</b><small>급할 때만 꺼내 써요</small></span><span class="row-value">500,000원</span></li>
        <li class="row"><span class="avatar" aria-hidden="true">월</span><span class="row-text"><b>월급 통장</b><small>월급이 들어오는 계좌</small></span><span class="row-value">400,000원</span></li>
      </ul>
      <div class="skeletons" style="--rows: 8" aria-hidden="true"></div>
    </section>

    <section class="screen" id="screen-work" data-screen="work" aria-labelledby="title-work">
      <header class="screen-top">
        <h1 class="screen-title" id="title-work">일</h1>
        <p class="screen-sub">아직 할 수 있는 일이 없어요</p>
      </header>
      <div class="skeletons" style="--rows: 14" aria-hidden="true"></div>
    </section>

    <section class="screen" id="screen-untitled" data-screen="untitled" aria-labelledby="title-untitled">
      <header class="screen-top">
        <h1 class="screen-title" id="title-untitled">무제</h1>
        <p class="screen-sub">아직 정해지지 않았어요</p>
      </header>
      <div class="skeletons" style="--rows: 14" aria-hidden="true"></div>
    </section>

    <section class="screen" id="screen-search" data-screen="search" aria-labelledby="title-search">
      <header class="screen-top">
        <h1 class="screen-title" id="title-search">무제</h1>
        <p class="screen-sub">아직 정해지지 않았어요</p>
      </header>
      <div class="skeletons" style="--rows: 14" aria-hidden="true"></div>
    </section>
  </main>

  <!-- 하단 탭 바: 알약형 탭 4개 + 떨어져 있는 둥근 검색 버튼. 렌즈 하나가 다섯 탭을 모두 오가요 -->
  <div class="dock">
    <nav class="lg-tabs" aria-label="메인 메뉴">
      <span class="lg-pill" hidden></span>
      <span class="lg-glowbox" data-glass-skip><span class="lg-glow"></span></span>
      <span class="platter platter-main"></span>
      <span class="platter platter-search"></span>

      <button type="button" data-tab="messages" data-group="main" aria-current="page">
        <!-- 종이비행기 -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21.5 2.5 2.5 10.2l6.76 1.99z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
          <path d="M21.5 2.5 10.74 13.81 13.6 21.5z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
        </svg>
        <span>메시지</span>
      </button>

      <button type="button" data-tab="money" data-group="main">
        <!-- 지갑 -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" stroke="none" d="M5.6 2.9h10.8a1.7 1.7 0 0 1 0 3.4H5.6a1.7 1.7 0 0 1 0-3.4z"/>

          <circle cx="15.9" cy="14.5" r="1.25" fill="currentColor" stroke="none"/>
        </svg>
        <span>돈</span>
      </button>

        </svg>
        <span>일</span>
      </button>

      <button type="button" data-tab="untitled" data-group="main">
        <!-- ? -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8.4 8.9a3.8 3.8 0 0 1 3.7-3.4c2.2 0 3.9 1.5 3.9 3.5 0 1.5-.9 2.4-2 3.2-1.1.8-1.8 1.4-1.8 2.8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="12.2" cy="19.4" r="1.8" fill="currentColor" stroke="none"/>

        <span>무제</span>
      </button>

      <button type="button" data-tab="search" data-group="search" aria-label="검색">
        <!-- 돋보기 -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.4" cy="10.4" r="6.2" fill="none" stroke="currentColor" stroke-width="2.7"/>
          <path d="m15.2 15.2 5.4 5.4" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>

      </button>
    </nav>
  </div>

</div>
