# 자본주의 시뮬레이터 러스트(WASM) 화면. 계획: docs/rust-migration-plan.md
[workspace]
members = ["crates/cloud", "crates/ui", "crates/app"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

[workspace.dependencies]
cloud = { path = "crates/cloud" }
ui = { path = "crates/ui" }
leptos = { version = "0.8", features = ["csr"] }
# wasm-bindgen 명령 도구와 같은 버전이어야 해요 (web/build.sh)
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "Node", "console"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

# 처음 받는 크기를 줄여요
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
